<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هتل شرک - لابی و آسانسور زرد</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #222;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        .prompt-box {
            position: absolute;
            top: 65%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 215, 0, 0.9);
            color: #000;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 20;
            border: 3px solid #006400;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background-color: rgba(0, 100, 0, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            border: 2px solid #fff;
        }

        #dialogue-box {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 100, 0, 0.95);
            color: #fff;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 20px;
            border: 4px solid #FFD700;
            display: none;
            width: 80%;
            max-width: 700px;
            text-align: right;
            z-index: 30;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #dialogue-speaker {
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 5px;
            font-size: 18px;
        }

        #dialogue-hint {
            font-size: 13px;
            color: #ddd;
            text-align: left;
            margin-top: 10px;
        }

        #transition-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="interaction-prompt" class="prompt-box">[E] صحبت با مهماندار</div>
    <div id="elevator-prompt" class="prompt-box">[E] ورود به آسانسور</div>
    
    <div id="dialogue-box">
        <div id="dialogue-speaker">گوینده</div>
        <div id="dialogue-text">متن دیالوگ...</div>
        <div id="dialogue-hint">[ SPACE ] برای ادامه</div>
    </div>

    <div id="transition-screen">در حال رفتن به طبقات بالا...</div>
    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        let gameStarted = true;
        let nearKey = false;
        let nearElevator = false;
        let inConversation = false;
        let keyTaken = false;
        let dialogueStep = 0;

        const dialogueLines = [
            { speaker: "الیسا لام", text: "سلام، خوبی؟ من یک اتاق می‌خواستم رزرو کنم." },
            { speaker: "مهماندار هتل", text: "سلام! بفرمایید، اینم کلید اتاق شما." }
        ];

        document.body.requestPointerLock();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x32CD32);
        scene.fog = new THREE.FogExp2(0x32CD32, 0.05);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const lamp = new THREE.PointLight(0xFFFF00, 1.2, 10);
        lamp.position.set(0, 4, -3);
        scene.add(lamp);

        const roomSize = 12;

        const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, 6), wallMat);
        backWall.position.set(0, 3, -roomSize/2);
        scene.add(backWall);

        const counterGeo = new THREE.BoxGeometry(3, 1.2, 1.2);
        const counterMat = new THREE.MeshStandardMaterial({ color: 0x556B2F });
        const counter = new THREE.Mesh(counterGeo, counterMat);
        counter.position.set(0, 0.6, -2.5);
        scene.add(counter);

        const keyGeo = new THREE.BoxGeometry(0.3, 0.2, 0.5);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2 });
        const keyMesh = new THREE.Mesh(keyGeo, keyMat);
        keyMesh.position.set(0, 1.3, -2.5);
        scene.add(keyMesh);

        const clerkGroup = new THREE.Group();
        const headMat = new THREE.MeshStandardMaterial({ color: 0x008000 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), headMat);
        head.position.set(0, 1.6, -3.2);
        clerkGroup.add(head);
        scene.add(clerkGroup);

        // --- آسانسور زرد رنگ ---
        const elevatorGroup = new THREE.Group();
        // چهارچوب آسانسور
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const elevatorBox = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 0.2), frameMat);
        elevatorBox.position.set(4, 1.75, -5.9);
        elevatorGroup.add(elevatorBox);

        // درب آسانسور (رنگ زرد جیغ و فانتزی)
        const yellowDoorMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3 });
        const elevatorDoor = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.2, 0.1), yellowDoorMat);
        elevatorDoor.position.set(4, 1.75, -5.85);
        elevatorGroup.add(elevatorDoor);
        scene.add(elevatorGroup);

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        window.addEventListener('click', () => {
            if (gameStarted && document.pointerLockElement !== document.body && !inConversation) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (event) => {
            if (!gameStarted || inConversation || document.pointerLockElement !== document.body) return;
            const movementX = event.movementX || event.mozMovementX || 0;
            const movementY = event.movementY || event.mozMovementY || 0;
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;
            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return;

            if (inConversation) {
                if (e.code === 'Space') {
                    dialogueStep++;
                    if (dialogueStep < dialogueLines.length) {
                        updateDialogueBox();
                    } else {
                        endConversation();
                    }
                }
                return;
            }

            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
                case 'KeyE':
                    if (nearKey && !keyTaken) {
                        startConversation();
                    } else if (nearElevator && keyTaken) {
                        enterElevator();
                    }
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted) return;
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
            }
        });

        function startConversation() {
            inConversation = true;
            document.exitPointerLock();
            document.getElementById('interaction-prompt').style.display = 'none';
            dialogueStep = 0;
            updateDialogueBox();
            document.getElementById('dialogue-box').style.display = 'block';
        }

        function updateDialogueBox() {
            document.getElementById('dialogue-speaker').innerText = dialogueLines[dialogueStep].speaker;
            document.getElementById('dialogue-text').innerText = dialogueLines[dialogueStep].text;
        }

        function endConversation() {
            inConversation = false;
            keyTaken = true;
            keyMesh.visible = false; 
            document.getElementById('dialogue-box').style.display = 'none';

            try {
                document.body.requestPointerLock();
            } catch (err) {}
        }

        function enterElevator() {
            gameStarted = false;
            document.exitPointerLock();
            document.getElementById('elevator-prompt').style.display = 'none';
            document.getElementById('transition-screen').style.display = 'flex';

            setTimeout(() => {
                window.location.href = '13s.html';
            }, 1000);
        }

        const clock = new THREE.Clock();
        const vecCamera = new THREE.Vector3();
        const vecKey = new THREE.Vector3(0, 1.3, -2.5);
        const vecElevator = new THREE.Vector3(4, 1.2, -5.0);

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && !inConversation) {
                const delta = clock.getDelta();
                const speed = 4.0 * delta;

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sideDir = new THREE.Vector3(dir.z, 0, -dir.x);

                let nextX = camera.position.x;
                let nextZ = camera.position.z;

                if (moveForward) { nextX += dir.x * speed; nextZ += dir.z * speed; }
                if (moveBackward) { nextX -= dir.x * speed; nextZ -= dir.z * speed; }
                if (moveLeft) { nextX += sideDir.x * speed; nextZ += sideDir.z * speed; }
                if (moveRight) { nextX -= sideDir.x * speed; nextZ -= sideDir.z * speed; }

                const margin = 0.8;
                const limit = (roomSize / 2) - margin;
                nextX = Math.max(-limit, Math.min(limit, nextX));
                nextZ = Math.max(-limit, Math.min(limit, nextZ));

                const minX = -1.6, maxX = 1.6;
                const minZ = -3.2, maxZ = -1.8;
                let collidingWithCounter = (nextX > minX && nextX < maxX && nextZ > minZ && nextZ < maxZ);

                if (!collidingWithCounter) {
                    camera.position.x = nextX;
                    camera.position.z = nextZ;
                }
                camera.position.y = 1.2;

                vecCamera.set(camera.position.x, camera.position.y, camera.position.z);
                
                const distKey = vecCamera.distanceTo(vecKey);
                const distElevator = vecCamera.distanceTo(vecElevator);
                
                const promptKey = document.getElementById('interaction-prompt');
                const promptElevator = document.getElementById('elevator-prompt');

                if (distKey < 2.0 && !keyTaken) {
                    nearKey = true;
                    promptKey.style.display = 'block';
                } else {
                    nearKey = false;
                    promptKey.style.display = 'none';
                }

                if (distElevator < 2.2 && keyTaken) {
                    nearElevator = true;
                    promptElevator.style.display = 'block';
                } else {
                    nearElevator = false;
                    promptElevator.style.display = 'none';
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
