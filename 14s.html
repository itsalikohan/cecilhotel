<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هتل شرک - داخل آسانسور</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        #room-info {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ff3333;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 18px;
            z-index: 30;
            border: 2px solid #ff3333;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            border: 2px solid #000;
        }

        /* عکسِ رو صفحه (14si1p.png) که دقیقاً با صدا میاد جلو */
        #jumpscare-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        /* افکت کابوس (قرمز و لرزان) */
        .nightmare-effect {
            filter: sepia(100%) saturate(600%) hue-rotate(-35deg) brightness(55%) contrast(160%);
            animation: shake 0.4s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            100% { transform: translate(2px, -2px) rotate(1deg); }
        }

        #blackout-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: block;
            transition: opacity 1s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="nightmare-effect">

    <div id="room-info">در حال انتقال با آسانسور...</div>
    <div id="blackout-screen"></div>

    <!-- عکس مورد نظر -->
    <img id="jumpscare-image" src="14si1p.png" alt="Nightmare Event">

    <!-- فایل صوتی اختصاصی 14si1p.mp3 با ولوم ۱۰۰٪ (حداکثر بلندی) -->
    <audio id="jumpscare-audio" src="14si1p.mp3" preload="auto"></audio>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        let gameStarted = false;
        let eventTriggered = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                const blackout = document.getElementById('blackout-screen');
                blackout.style.opacity = '0';
                setTimeout(() => {
                    blackout.style.display = 'none';
                    gameStarted = true;
                    document.body.requestPointerLock();

                    // --- تایمر ۴ ثانیه‌ای برای شروع انفجار وحشت! ---
                    setTimeout(() => {
                        if (!eventTriggered) {
                            eventTriggered = true;

                            // پخش با حداکثر بلندی صدا (Volume = 1.0)
                            const audio = document.getElementById('jumpscare-audio');
                            audio.volume = 1.0;
                            audio.play().catch(e => console.log("Audio play blocked by browser policy:", e));

                            // نمایش عکس 14si1p.png وسط صفحه
                            const img = document.getElementById('jumpscare-image');
                            img.style.display = 'block';
                            img.style.opacity = '1';

                            // بعد از 1.5 ثانیه عکس میره و بلافاصله وارد 15s.html میشه
                            setTimeout(() => {
                                img.style.opacity = '0';
                                setTimeout(() => {
                                    window.location.href = '15s.html';
                                }, 200);
                            }, 1500);
                        }
                    }, 4000); // ۴ ثانیه بعد از ورود

                }, 1000);
            }, 500);
        });

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x110505);
        scene.fog = new THREE.FogExp2(0x110505, 0.04);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x551111, 0.6);
        scene.add(ambientLight);

        const elevatorLight = new THREE.PointLight(0xff2222, 2.0, 8);
        elevatorLight.position.set(0, 2.6, 0);
        scene.add(elevatorLight);

        const width = 3.2;
        const depth = 3.2;
        const height = 2.8;

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x332222, metalness: 0.6, roughness: 0.4 });
        
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const ctx = floorCanvas.getContext('2d');
        ctx.fillStyle = '#221a1a';
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#443333';
        ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, 256, 256);
        ctx.beginPath();
        ctx.moveTo(0, 128); ctx.lineTo(256, 128);
        ctx.moveTo(128, 0); ctx.lineTo(128, 256);
        ctx.stroke();

        const floorTexture = new THREE.CanvasTexture(floorCanvas);
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(2, 2);

        const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.5 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(width, depth), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(width, depth), wallMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = height;
        scene.add(ceiling);

        const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
        wallBack.position.set(0, height / 2, -depth / 2);
        scene.add(wallBack);

        const wallFront = new THREE.Mesh(new THREE.PlaneGeometry(width, height), wallMat);
        wallFront.rotation.y = Math.PI;
        wallFront.position.set(0, height / 2, depth / 2);
        scene.add(wallFront);

        const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(depth, height), wallMat);
        wallLeft.rotation.y = Math.PI / 2;
        wallLeft.position.set(-width / 2, height / 2, 0);
        scene.add(wallLeft);

        const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(depth, height), wallMat);
        wallRight.rotation.y = -Math.PI / 2;
        wallRight.position.set(width / 2, height / 2, 0);
        scene.add(wallRight);

        const panelGeo = new THREE.BoxGeometry(0.4, 0.8, 0.05);
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 });
        const elevatorPanel = new THREE.Mesh(panelGeo, panelMat);
        elevatorPanel.position.set(width / 2 - 0.05, 1.3, 0.5);
        elevatorPanel.rotation.y = -Math.PI / 2;
        scene.add(elevatorPanel);

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;

        window.addEventListener('click', () => {
            if (gameStarted && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (event) => {
            if (!gameStarted || document.pointerLockElement !== document.body) return;
            const movementX = event.movementX || event.mozMovementX || 0;
            const movementY = event.movementY || event.mozMovementY || 0;
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;
            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted) return;
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                const delta = clock.getDelta();
                const speed = 3.0 * delta;

                elevatorLight.intensity = 1.8 + Math.sin(Date.now() * 0.008) * 0.4;

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sideDir = new THREE.Vector3(dir.z, 0, -dir.x);

                let nextX = camera.position.x;
                let nextZ = camera.position.z;

                if (moveForward) { nextX += dir.x * speed; nextZ += dir.z * speed; }
                if (moveBackward) { nextX -= dir.x * speed; nextZ -= dir.z * speed; }
                if (moveLeft) { nextX += sideDir.x * speed; nextZ += sideDir.z * speed; }
                if (moveRight) { nextX -= sideDir.x * speed; nextZ -= sideDir.z * speed; }

                const limitX = (width / 2) - 0.4;
                const limitZ = (depth / 2) - 0.4;
                nextX = Math.max(-limitX, Math.min(limitX, nextX));
                nextZ = Math.max(-limitZ, Math.min(limitZ, nextZ));

                camera.position.x = nextX;
                camera.position.z = nextZ;
                camera.position.y = 1.2;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
