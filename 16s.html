<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هتل شرک - پایان بازی (The End)</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* کادر تیتراژ پایانی و اطلاعات نسخه */
        #end-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 0, 0, 0.95);
            color: #ffffff;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            border: 4px solid #8B0000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.6);
            animation: pulse-box 2s infinite;
        }

        #end-box h1 {
            color: #ff2222;
            font-size: 45px;
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 5px #000;
        }

        .version-text {
            color: #aaaaaa;
            font-size: 18px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        #end-box p {
            font-size: 22px;
            margin: 10px 0;
            color: #ff9999;
        }

        .creator-name {
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .hint-text {
            font-size: 15px;
            color: #cccccc;
            animation: blink 1s infinite;
            border-top: 1px dashed #555;
            padding-top: 15px;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        @keyframes pulse-box {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(255,0,0,0.4); }
            50% { transform: translate(-50%, -50%) scale(1.02); box-shadow: 0 0 60px rgba(255,0,0,0.7); }
            100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(255,0,0,0.4); }
        }

        #blackout-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 200;
            display: block;
            transition: opacity 1.5s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="blackout-screen"></div>

    <!-- کادر اصلی پایان بازی -->
    <div id="end-box">
        <h1>THE END</h1>
        <div class="version-text">نسخه بازی: 0.1 Demo</div>
        <p>سازنده بازی:</p>
        <div class="creator-name">itsalikohan</div>
        <div class="hint-text">[ برای بازگشت به منوی اصلی، کلید Space را فشار دهید ]</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let pageReady = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                const blackout = document.getElementById('blackout-screen');
                blackout.style.opacity = '0';
                setTimeout(() => {
                    blackout.style.display = 'none';
                    pageReady = true;
                }, 1500);
            }, 500);
        });

        // با زدن کلید اسپیس، برمی‌گرده به index.html
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && pageReady) {
                window.location.href = 'index.html';
            }
        });

        // افکت پس‌زمینه سه‌بعدی تاریک و ترسناک برای صفحه آخر
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050202);
        scene.fog = new THREE.FogExp2(0x050202, 0.1);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x110202, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff0000, 2, 10);
        pointLight.position.set(0, 0, 2);
        scene.add(pointLight);

        // چرخش آرام محیط سه‌زمینه برای جذابیت بیشتر تیتراژ
        const geometry = new THREE.BoxGeometry(8, 8, 8);
        const material = new THREE.MeshStandardMaterial({ color: 0x0f0a0a, roughness: 0.9, side: THREE.BackSide });
        const backgroundRoom = new THREE.Mesh(geometry, material);
        scene.add(backgroundRoom);

        function animate() {
            requestAnimationFrame(animate);
            backgroundRoom.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
